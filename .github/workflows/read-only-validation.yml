name: Read-only validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository content is readable
        run: |
          echo "Validating read-only repository access"
          test -f README.md
          echo "Repository content is readable"
